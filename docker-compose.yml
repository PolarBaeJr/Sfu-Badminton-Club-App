# Pi deploy: joins the external `edge` network; proxy-manager routes by the
# proxy.* labels below. PROXY_DOMAIN in .env sets the served host
# (sfubadminton.com) — BOTH apps now live on it, the player at / and the admin
# console at /admin. admin.sfubadminton.com no longer serves anything.
networks:
  edge:
    external: true

services:
  player:
    # CI builds this image (see .github/workflows/build-images.yml);
    # deploy with `docker compose pull && up -d`. The build: block remains
    # as a fallback for building on the Pi (`--build`).
    image: ghcr.io/polarbaejr/badminton-player:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-player
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_PLAYER_URL=${NEXT_PUBLIC_PLAYER_URL}
        - NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL}
        # Passkey RP ID must be the registrable parent. CI already passes it
        # (build-images.yml); mirrored here so a fallback `--build` on the Pi
        # can't silently rescope credentials to a hostname and lock admins out.
        - NEXT_PUBLIC_PASSKEY_RP_ID=${NEXT_PUBLIC_PASSKEY_RP_ID}
        # Shared auth cookie scope. Build-time only — see the Dockerfile ARG.
        - NEXT_PUBLIC_AUTH_COOKIE_DOMAIN=${NEXT_PUBLIC_AUTH_COOKIE_DOMAIN}
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
        - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY}
        - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST}
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3011:3000"
    restart: unless-stopped
    networks: [edge, default]
    labels:
      proxy.enable:     "true"
      proxy.host:       "${PROXY_DOMAIN:-sfubadminton.com}"
      # Explicit "/" (not empty) so the player is a real path-prefix group;
      # admin's longer "/admin" wins longest-prefix. An empty path here makes
      # the player a host catch-all that pools with the admin backend.
      proxy.path:       "/"
      proxy.port:       "3000"
      proxy.service:    "badminton-player"
      proxy.unscalable: "true"
      proxy.autoupdate:  "true"
    healthcheck:
      # node -e fetch(): the slim runtime image has no curl/wget
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin:
    image: ghcr.io/polarbaejr/badminton-admin:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-admin
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_PLAYER_URL=${NEXT_PUBLIC_PLAYER_URL}
        - NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL}
        # Mount point, baked into the build — Next cannot decide basePath at
        # runtime. Must agree with proxy.path below and with the "/admin" the
        # player app links to; the three move together or the console 404s.
        - NEXT_PUBLIC_BASE_PATH=${ADMIN_BASE_PATH:-/admin}
        # Passkey RP ID must be the registrable parent. CI already passes it
        # (build-images.yml); mirrored here so a fallback `--build` on the Pi
        # can't silently rescope credentials to a hostname and lock admins out.
        - NEXT_PUBLIC_PASSKEY_RP_ID=${NEXT_PUBLIC_PASSKEY_RP_ID}
        # Shared auth cookie scope. Must be IDENTICAL to the player app's value
        # — the two write the same cookie, and a mismatch produces two cookies
        # of the same name on different scopes. EMPTY is correct now: the
        # console shares the player app's origin, so a host-only cookie already
        # covers both and no cross-subdomain scoping is needed.
        - NEXT_PUBLIC_AUTH_COOKIE_DOMAIN=${NEXT_PUBLIC_AUTH_COOKIE_DOMAIN}
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3010:3001"
    restart: unless-stopped
    networks: [edge, default]
    labels:
      proxy.enable:     "true"
      # Same host as the player app, under /admin. The console used to have its
      # own subdomain; a cross-origin link cannot stay inside the installed
      # player PWA, so tapping "Exec Panel" threw execs out into a browser tab —
      # constantly, since they use it to check members in at the door.
      # Longest-prefix matching puts this ahead of the player's "/"
      # (cmd/proxy/router.go sorts route groups by descending prefix length).
      proxy.host:       "${PROXY_DOMAIN:-sfubadminton.com}"
      proxy.path:       "/admin"
      # MUST stay false. The app is BUILT with basePath=/admin, so it expects to
      # see the prefix on every request; stripping it 404s the whole console.
      proxy.strip:      "false"
      proxy.port:       "3001"
      proxy.service:    "badminton-admin"
      proxy.unscalable: "true"
      proxy.autoupdate:  "true"
    healthcheck:
      # Probe /admin, not /: with a basePath the root is a 404, and this
      # status<500 test would cheerfully call that healthy.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/admin').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

