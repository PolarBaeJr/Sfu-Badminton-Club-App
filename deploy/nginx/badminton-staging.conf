# nginx site config for the staging deploy.
# Copy to /etc/nginx/sites-enabled/badminton-staging.conf on the Pi
# and run `sudo nginx -t && sudo nginx -s reload`.
#
# Mirrors the live badminton.conf but routes test.polardev.org to the
# parallel staging containers (3013 player, 3014 admin) instead of the
# prod containers (3010/3011).

server {
    listen 443 ssl;
    listen 5443 ssl;
    http2 on;
    server_name test.polardev.org;

    ssl_certificate     /etc/ssl/certs/demo-origin.pem;
    ssl_certificate_key /etc/ssl/private/demo-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /admin {
        proxy_pass http://127.0.0.1:3014;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    server_name test.polardev.org;
    return 301 https://$host$request_uri;
}
