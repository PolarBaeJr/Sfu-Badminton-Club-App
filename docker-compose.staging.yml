# Staging stack: the same two apps as production, on badminton.polardev.org,
# talking to a completely separate Supabase (supabase-staging, kong on 64321).
#
# Why a second stack at all: every NEXT_PUBLIC_* value is a Docker build arg,
# inlined into the client bundle at build time. The production image therefore
# has production's Supabase URL compiled into it — pointing it at a staging
# .env would move the server but leave every browser-side query aimed at the
# production database. Staging needs its own build, not just its own config.
#
# Images are built elsewhere (CI, or the Mac while CI is unavailable) and loaded
# onto the Pi. There is deliberately no `build:` block: the Pi does not build.
#
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
#
# MUST stay set, and this stack MUST be run from its own directory — never from
# production's. Compose identifies a service by project + service name, NOT by
# container_name. Without this key the project name defaults to the working
# directory, so running this file from /mnt/ssd/Deploy/badminton made `player`
# and `admin` here collide with production's services of the same name and
# destroyed the running production containers. container_name does not isolate
# anything; only the project name does.
name: badminton-staging

networks:
  edge:
    external: true

services:
  player:
    image: ghcr.io/polarbaejr/badminton-player-staging:${STAGING_IMAGE_TAG:-latest}
    container_name: badminton-staging-player
    env_file: .env.staging
    environment:
      # In-cluster, and it resolves to STAGING's bot because compose service
      # names are scoped to the project name at the top of this file. That
      # scoping is the whole safety story here: `bot` from production's project
      # is a different container, and staging can never reach it.
      #
      # DISCORD_SERVICE_SECRET is deliberately NOT repeated here — it arrives
      # through env_file like every other staging secret, and it must be the
      # same value the staging bot gets.
      DISCORD_BOT_URL: ${DISCORD_BOT_URL:-http://bot:3002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3013:3000"
    restart: unless-stopped
    networks: [edge, default]
    labels:
      proxy.enable:     "true"
      proxy.host:       "${PROXY_DOMAIN:-badminton.polardev.org}"
      # Explicit "/" so the player is a real path-prefix group rather than a host
      # catch-all; /admin and /supabase are longer and win longest-prefix.
      proxy.path:       "/"
      proxy.port:       "3000"
      proxy.health:     "/api/health/ready"
      proxy.service:    "badminton-staging-player"
      proxy.unscalable: "true"
      # Safe because the image above is a *separate GHCR package*, not a second
      # tag on production's. The auto-updater watches each container's own image
      # reference (proxy-manager cmd/dashboard/autoupdate.go) and replaces it
      # with the same reference, so this can only ever pull a staging build.
      # It would NOT be safe if staging shared production's package.
      proxy.autoupdate: "true"
    healthcheck:
      # Same test as production — see docker-compose.yml for the full reasoning.
      # In short: manual redirects so a 307 to /login cannot be followed into a
      # cheerful 200, exactly 200 rather than anything under 500, and a fixed
      # {"ok":true} body so HTML under a 200 cannot pass.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready',{redirect:'manual'}).then(async r=>{if(r.status!==200)process.exit(1);const b=await r.json();process.exit(b&&b.ok===true?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  admin:
    image: ghcr.io/polarbaejr/badminton-admin-staging:${STAGING_IMAGE_TAG:-latest}
    container_name: badminton-staging-admin
    env_file: .env.staging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3014:3001"
    restart: unless-stopped
    networks: [edge, default]
    labels:
      proxy.enable:     "true"
      proxy.host:       "${PROXY_DOMAIN:-badminton.polardev.org}"
      proxy.path:       "/admin"
      # MUST stay false — the image is built with basePath=/admin and expects to
      # see the prefix on every request. Stripping it 404s the whole console.
      proxy.strip:      "false"
      proxy.port:       "3001"
      proxy.health:     "/admin/api/health/ready"
      proxy.service:    "badminton-staging-admin"
      proxy.unscalable: "true"
      # See the player service above — safe only because this is its own package.
      proxy.autoupdate: "true"
    healthcheck:
      # The /admin prefix is required — the image is built with basePath=/admin,
      # so the unprefixed path is a 404, and a 404 now fails the check.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/admin/api/health/ready',{redirect:'manual'}).then(async r=>{if(r.status!==200)process.exit(1);const b=await r.json();process.exit(b&&b.ok===true?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # The Discord bot, staging copy.
  #
  # ---- IT NEEDS ITS OWN DISCORD APPLICATION ----
  #
  # An interactions endpoint URL is a property of the APPLICATION, and one
  # application has exactly one. Pointing production's application at this host
  # is not "testing on staging", it is moving production onto staging. Create a
  # second application, point it here, and invite it to a private test server.
  #
  # The consequence worth planning for: a second application is a second bot
  # user with its own token, so DISCORD_BOT_TOKEN, DISCORD_PUBLIC_KEY,
  # DISCORD_APPLICATION_ID and DISCORD_GUILDS in .env.staging are ALL different
  # values from production's, not copies. DISCORD_SERVICE_SECRET is different
  # too, but for a different reason: it is what the staging player app compares
  # on /api/discord/*, so sharing production's would let one stack's bot drive
  # the other's roles.
  bot:
    image: ghcr.io/polarbaejr/badminton-bot-staging:${STAGING_IMAGE_TAG:-latest}
    container_name: badminton-staging-bot
    env_file: .env.staging
    environment:
      # Same ${VAR:?} guard as production: compose refuses to start rather than
      # booting a bot holding an empty key, which fails closed later and in a
      # place that looks like a Discord problem. Interpolated from the file
      # passed as --env-file, which for this stack is .env.staging.
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:?set DISCORD_PUBLIC_KEY in .env.staging}
      DISCORD_BOT_TOKEN:  ${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN in .env.staging}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:?set DISCORD_APPLICATION_ID in .env.staging}
      DISCORD_GUILDS: ${DISCORD_GUILDS:?set DISCORD_GUILDS in .env.staging}
      DISCORD_SERVICE_SECRET: ${DISCORD_SERVICE_SECRET:?set DISCORD_SERVICE_SECRET in .env.staging}
      # Optional. Point it at a channel in the test server, not the real one.
      DISCORD_AUDIT_CHANNEL_ID: ${DISCORD_AUDIT_CHANNEL_ID:-}
      APP_API_URL: ${APP_API_URL:-http://player:3000}
      # The public origin, because it goes into the /link button a member opens
      # in their own browser. Staging's origin, so a staging link cannot walk
      # somebody into production.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://badminton.polardev.org}
    ports:
      - "3015:3002"
    restart: unless-stopped
    networks: [edge, default]
    labels:
      proxy.enable:     "true"
      # NEVER add proxy.auth here, on staging any more than on production.
      # Discord POSTs interactions with no cookie and no session, and pg_net
      # calls POST /sync the same way; a gated host refuses both. The gate is
      # opt-in per host via this label, so omitting it IS the exclusion.
      proxy.host:       "${DISCORD_BOT_DOMAIN_STAGING:-discord-staging.polardev.org}"
      proxy.port:       "3002"
      proxy.health:     "/health"
      proxy.service:    "badminton-staging-discord-bot"
      proxy.autoupdate: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(async r=>{if(r.status!==200)process.exit(1);const b=await r.json();process.exit(b&&b.ok===true?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
