<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Red brand square — never pure black/white per design token hard overrides -->
  <rect width="1024" height="1024" fill="#CC0000"/>
  <!-- Shuttlecock mark scaled from the design's ShuttleMark
       (apps/player/src/components/v2/atoms-display.tsx:11-22).
       Original viewBox is 24x24; here we draw at 24x scale within a 1024
       canvas, centered with comfortable safe-area padding. The transform
       takes (0,0)→(1024,1024) with a 24-unit canvas reference and pads
       by 4 units on each side so the glyph fills 16/24 ≈ 67% of the icon. -->
  <g transform="translate(170.66, 170.66) scale(28.44)">
    <!-- The base of the shuttlecock — solid filled circle at the bottom. -->
    <circle cx="12" cy="18" r="3.5" fill="#F2F2F2"/>
    <!-- Inner two feathers (brighter — closer to viewer). -->
    <path d="M12 14 L7 4 L9 4 L12 13 Z" fill="#F2F2F2" opacity="0.85"/>
    <path d="M12 14 L17 4 L15 4 L12 13 Z" fill="#F2F2F2" opacity="0.85"/>
    <!-- Outer two feathers (dimmer — slight perspective). -->
    <path d="M12 14 L4 7 L6 5 L12 13 Z" fill="#F2F2F2" opacity="0.6"/>
    <path d="M12 14 L20 7 L18 5 L12 13 Z" fill="#F2F2F2" opacity="0.6"/>
  </g>
</svg>
